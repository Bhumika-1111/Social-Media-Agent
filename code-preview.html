<title>Code Preview – Social Media Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1e1e2e; font-family: 'Consolas', 'Courier New', monospace; height: 100vh; display: flex; flex-direction: column; }

  /* ── Title bar ── */
  .titlebar { background: #11111b; height: 32px; display: flex; align-items: center; padding: 0 14px; gap: 8px; flex-shrink: 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-red { background: #ff5f56; } .dot-yellow { background: #ffbd2e; } .dot-green { background: #27c93f; }
  .titlebar-name { color: #6c7086; font-size: 0.72rem; margin-left: 10px; }

  /* ── Activity bar ── */
  .layout { display: flex; flex: 1; overflow: hidden; }
  .activity { width: 48px; background: #181825; display: flex; flex-direction: column; align-items: center; padding-top: 10px; gap: 18px; flex-shrink: 0; border-right: 1px solid #313244; }
  .act-icon { color: #6c7086; font-size: 1.1rem; cursor: pointer; padding: 6px; border-radius: 4px; }
  .act-icon.active { color: #cdd6f4; border-left: 2px solid #89b4fa; margin-left: -2px; }

  /* ── File explorer ── */
  .explorer { width: 200px; background: #181825; border-right: 1px solid #313244; padding: 10px 0; flex-shrink: 0; }
  .exp-title { font-size: 0.65rem; color: #6c7086; text-transform: uppercase; letter-spacing: .1em; padding: 0 14px 8px; font-weight: 700; }
  .exp-folder { font-size: 0.75rem; color: #cdd6f4; padding: 4px 14px; display: flex; align-items: center; gap: 6px; }
  .exp-folder i { color: #89b4fa; font-size: 0.75rem; }
  .exp-file { font-size: 0.75rem; color: #a6adc8; padding: 4px 14px 4px 28px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.1s; }
  .exp-file:hover { background: #313244; color: #cdd6f4; }
  .exp-file.active { background: #313244; color: #cdd6f4; }
  .exp-file i { font-size: 0.7rem; }
  .ico-html { color: #e06c75; } .ico-css { color: #89b4fa; } .ico-js { color: #f9e2af; } .ico-md { color: #a6e3a1; }

  /* ── Editor area ── */
  .editor { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Tab bar ── */
  .tabs { display: flex; background: #181825; border-bottom: 1px solid #313244; flex-shrink: 0; overflow-x: auto; }
  .tab { display: flex; align-items: center; gap: 7px; padding: 8px 16px; font-size: 0.75rem; color: #6c7086; cursor: pointer; border-right: 1px solid #313244; white-space: nowrap; transition: background 0.1s; min-width: 100px; }
  .tab:hover { background: #1e1e2e; color: #a6adc8; }
  .tab.active { background: #1e1e2e; color: #cdd6f4; border-top: 1px solid #89b4fa; }
  .tab i { font-size: 0.7rem; }

  /* ── Code pane ── */
  .code-pane { display: none; flex: 1; overflow-y: auto; padding: 14px 0; }
  .code-pane.active { display: block; }

  /* ── Line numbers + code ── */
  .code-body { display: table; width: 100%; }
  .line { display: table-row; }
  .line:hover .ln { background: #313244; } .line:hover .lc { background: #26263a; }
  .ln { display: table-cell; width: 42px; text-align: right; padding: 0 12px 0 0; color: #45475a; font-size: 0.78rem; line-height: 1.7; user-select: none; vertical-align: top; border-right: 1px solid #313244; }
  .lc { display: table-cell; padding: 0 20px; font-size: 0.78rem; line-height: 1.7; color: #cdd6f4; white-space: pre; }

  /* ── Syntax colours ── */
  .kw  { color: #cba6f7; } /* keyword: DOCTYPE, html, head etc */
  .tag { color: #89b4fa; } /* html tags */
  .atr { color: #89dceb; } /* attributes */
  .str { color: #a6e3a1; } /* strings */
  .cmt { color: #6c7086; font-style: italic; } /* comments */
  .fn  { color: #89b4fa; } /* function names */
  .sel { color: #89b4fa; } /* css selectors */
  .prp { color: #89dceb; } /* css properties */
  .val { color: #a6e3a1; } /* css values */
  .num { color: #fab387; } /* numbers */
  .var { color: #f38ba8; } /* variables */
  .pun { color: #cdd6f4; } /* punctuation */

  /* ── Status bar ── */
  .statusbar { height: 24px; background: #89b4fa; display: flex; align-items: center; padding: 0 14px; gap: 16px; flex-shrink: 0; }
  .sb-item { font-size: 0.68rem; color: #1e1e2e; font-weight: 600; display: flex; align-items: center; gap: 4px; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #1e1e2e; }
  ::-webkit-scrollbar-thumb { background: #45475a; border-radius: 3px; }
</style>

<script>
/* ── Tab switcher ── */
function showTab(id) {
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  document.querySelectorAll('.code-pane').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.exp-file').forEach(function(f){ f.classList.remove('active'); });
  document.getElementById('tab-' + id).classList.add('active');
  document.getElementById('pane-' + id).classList.add('active');
  var files = ['html','css','js','md'];
  document.querySelectorAll('.exp-file').forEach(function(f, i){ if(files[i] === id) f.classList.add('active'); });
}

/* ── Render lines ── */
function renderLines(containerId, lines) {
  var body = document.getElementById(containerId);
  body.innerHTML = lines.map(function(line, i) {
    return '<div class="line"><span class="ln">' + (i+1) + '</span><span class="lc">' + line + '</span></div>';
  }).join('');
}

/* ── Escape HTML helper ── */
function e(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
